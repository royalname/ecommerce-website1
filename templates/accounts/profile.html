{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

```
<div class="col-md-7 col-lg-6">

    <div class="card shadow border-0">

        <div class="card-header bg-primary text-white text-center py-3">

            <h4 class="mb-0">
                <i class="bi bi-person-circle"></i>
                My Profile
            </h4>

        </div>

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <i class="bi bi-person-circle display-1 text-primary"></i>

                <h4 class="mt-2">
                    {{ user.username }}
                </h4>

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Username
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ user.username }}"
                           readonly>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            First Name
                        </label>

                        <input type="text"
                               name="first_name"
                               class="form-control"
                               value="{{ user.first_name }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Last Name
                        </label>

                        <input type="text"
                               name="last_name"
                               class="form-control"
                               value="{{ user.last_name }}">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Email
                    </label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ user.email }}">

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Date Joined
                    </label>

                    <input type="text"
                           class="form-control"
                           value="{{ user.date_joined|date:'F d, Y' }}"
                           readonly>

                </div>

                <button type="submit"
                        class="btn btn-success w-100">

                    <i class="bi bi-check-circle"></i>
                    Update Profile

                </button>

            </form>

            <div class="d-grid mt-3">

    <a href="{% url 'change_password' %}"
       class="btn btn-outline-danger">

        <i class="bi bi-key"></i>
        Change Password

    </a>

</div>

            <hr>

            <div class="d-grid gap-2">

                <a href="{% url 'my_orders' %}"
                   class="btn btn-primary">

                    <i class="bi bi-bag-check"></i>
                    My Orders

                </a>

                <a href="{% url 'products' %}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-shop"></i>
                    Continue Shopping

                </a>

            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
