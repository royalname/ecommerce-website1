{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Checkout
    </h2>

    <form method="POST" action="{% url 'place_order' %}">
    {% csrf_token %}

        <div class="row">

            <div class="col-md-6">

                <label class="form-label">
                    Full Name
                </label>

                <input
    type="text"
    name="full_name"
    class="form-control"
    value="{{ request.user.get_full_name }}"
    required>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Email
                </label>

                <input
    type="email"
    name="email"
    class="form-control"
    value="{{ request.user.email }}"
    required>

            </div>

        </div>

        <div class="mt-3">

            <label class="form-label">
                Phone Number
            </label>

 <input
    type="tel"
    name="phone"
    class="form-control"
    placeholder="98XXXXXXXX"
    pattern="[0-9]{10}"
    maxlength="10"
    minlength="10"
    required>

        </div>

        <div class="mt-3">

            <label class="form-label">
                Delivery Address
            </label>

            <textarea
    name="address"
    class="form-control"
    rows="4"
    placeholder="Enter delivery address"
    required></textarea>

        </div>

        <hr>

        <h4>

            Order Summary

        </h4>

        <table class="table">

            <tr>

                <th>Product</th>

                <th>Qty</th>

                <th>Subtotal</th>

            </tr>

            {% for item in items %}

            <tr>

                <td>{{ item.product.name }}</td>

                <td>{{ item.quantity }}</td>

                <td>Rs. {{ item.subtotal }}</td>

            </tr>

            {% endfor %}

        </table>

        <div class="text-end">

            <h3>

                Grand Total: Rs. {{ total }}

            </h3>

        </div>

        <button class="btn btn-success btn-lg mt-3">

            Place Order

        </button>

    </form>

</div>

{% endblock %}
