{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            Complete Your Payment
        </h2>

        <h5>Order #{{ order.id }}</h5>

        <h4 class="text-success">
            Total: Rs. {{ order.total_amount }}
        </h4>

        <hr>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <h5>Select Payment Method</h5>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="payment_method"
                       id="esewa"
                       value="eSewa"
                       required>

                <label class="form-check-label" for="esewa">
                    eSewa
                </label>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input"
                       type="radio"
                       name="payment_method"
                       id="khalti"
                       value="Khalti">

                <label class="form-check-label" for="khalti">
                    Khalti
                </label>
            </div>

            <!-- eSewa QR -->
            <div id="esewaQR" class="text-center" style="display:none;">

                <h4 class="text-success">
                    Scan with eSewa
                </h4>

                <img src="/static/images/esewa.jpg"
                     class="img-fluid border rounded"
                     style="max-width:300px;">

            </div>

            <!-- Khalti QR -->
            <div id="khaltiQR" class="text-center" style="display:none;">

                <h4 class="text-primary">
                    Scan with Khalti
                </h4>

                <img src="/static/images/khalti.jpg"
                     class="img-fluid border rounded"
                     style="max-width:300px;">

            </div>

            <hr>

            <h5>Upload Payment Screenshot</h5>

            <input
                type="file"
                name="payment_screenshot"
                class="form-control"
                accept="image/*"
                required>

            <br>

            <button class="btn btn-success btn-lg w-100">

                Submit Payment

            </button>

        </form>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const esewa = document.getElementById("esewa");
    const khalti = document.getElementById("khalti");

    const esewaQR = document.getElementById("esewaQR");
    const khaltiQR = document.getElementById("khaltiQR");

    esewa.addEventListener("change", function () {

        esewaQR.style.display = "block";
        khaltiQR.style.display = "none";

    });

    khalti.addEventListener("change", function () {

        esewaQR.style.display = "none";
        khaltiQR.style.display = "block";

    });

});

</script>

{% endblock %}
